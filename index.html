<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#1d2135;--muted:#6b7285;--primary:#4f46e5;--primary-soft:#eceeff;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--border:#e6e8f2;--r:18px;--shadow:0 1px 2px rgba(20,24,60,.05),0 8px 24px rgba(20,24,60,.06)}
[data-theme=dark]{--bg:#0e111f;--card:#171b2f;--text:#e8eaf6;--muted:#9299b5;--primary:#8b93ff;--primary-soft:#232849;--border:#262b47;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;font-size:15px;padding-bottom:90px}
h1,h2,h3{margin:0 0 8px;line-height:1.5}h2{font-size:18px}h3{font-size:16px}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
.top .brand b{display:block;line-height:1.3}.top .brand small{color:var(--muted);font-size:12px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;font-size:22px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.sp{flex:1}
.ic{width:40px;height:40px;border:1px solid var(--border);background:var(--card);border-radius:12px;cursor:pointer;font-size:18px;display:grid;place-items:center}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 70%,#a855f7);color:#fff;border:0}
.hero small{opacity:.85}.hero .q{font-size:17px;font-weight:500;margin-top:10px;line-height:2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.btn{border:0;background:var(--primary);color:#fff;padding:10px 16px;border-radius:12px;cursor:pointer;font-weight:500}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:var(--primary-soft);color:var(--primary)}
.btn.danger{background:#fee2e2;color:#b91c1c}
.btn.light{background:rgba(255,255,255,.2);color:#fff}
.btn:active{transform:scale(.98)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[type=checkbox],input[type=radio]{width:auto}
input[type=range]{padding:0}
.jp{display:grid;grid-template-columns:70px 1fr 90px;gap:6px}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:500;background:color-mix(in srgb,var(--c,#888) 16%,transparent);color:var(--c,#888)}
.mini{font-style:normal;font-size:11px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--c,#888) 16%,transparent);color:var(--c,#888);margin-right:6px}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary)}
.task{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--border)}
.task:last-child{border:0}.task.done span.grow{text-decoration:line-through;color:var(--muted)}
.task input{width:20px;height:20px;accent-color:var(--primary)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.add{display:flex;gap:6px;margin-top:10px}.add input{flex:1}.add select{width:120px}
.slot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-right:5px solid var(--c);cursor:pointer}
.slot.now{box-shadow:0 0 0 2px var(--c)}.slot.done{opacity:.55}
.slot .time{font-size:12px;color:var(--muted);min-width:78px}.slot small{display:block;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff;background:transparent;font-size:14px}
.slot.done .tick{background:var(--c)}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.plan{border-collapse:separate;border-spacing:4px;min-width:820px;width:100%}
table.plan th{font-size:12px;color:var(--muted);font-weight:600;padding:6px 4px;white-space:nowrap}
table.plan th.today{color:var(--primary)}
table.plan th.rh{position:sticky;right:0;background:var(--card);z-index:2;font-weight:600;font-size:13px;color:var(--text);min-width:64px}table.plan th.ch{cursor:pointer;background:var(--primary-soft);border-radius:10px;color:var(--text);font-size:11px;line-height:1.5;min-width:76px}
table.plan td{background:var(--bg);border-radius:10px;height:58px;min-width:76px;text-align:center;vertical-align:middle;cursor:pointer;padding:3px}
table.plan td.today{outline:2px solid var(--primary-soft)}
.cell{border-radius:9px;padding:6px 2px;font-size:12px;font-weight:600;color:#fff;background:var(--c);line-height:1.5}
.plus{color:var(--muted);font-size:18px}
.stat{padding:14px;border-radius:16px;background:var(--primary-soft);text-align:center}
.stat b{display:block;font-size:19px;color:var(--primary)}.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:130px;margin-top:10px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--muted)}
.bars i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--primary);min-height:2px;opacity:.85}
.bars i.ok{background:var(--ok)}
.hb{margin:8px 0}.hb .l{display:flex;justify-content:space-between;font-size:13px;margin-bottom:2px}
.hb .t{height:9px;border-radius:9px;background:var(--bg);overflow:hidden;position:relative}.hb .t i{display:block;height:100%;border-radius:9px;background:var(--c,var(--primary))}
.hb .t u{position:absolute;top:0;bottom:0;width:2px;background:var(--text);opacity:.5}
.tabs{display:flex;gap:6px;background:var(--bg);padding:4px;border-radius:14px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--primary);font-weight:700;box-shadow:var(--shadow)}
.drawer{position:fixed;top:0;bottom:0;right:0;width:290px;max-width:86vw;background:var(--card);transform:translateX(105%);transition:.28s;z-index:60;padding:16px 12px;overflow:auto;border-left:1px solid var(--border)}
.drawer.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.5);opacity:0;pointer-events:none;transition:.25s;z-index:50}.ov.open{opacity:1;pointer-events:auto}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;background:none;border-radius:14px;cursor:pointer;text-align:right;font-size:15px}
.nav.on{background:var(--primary-soft);color:var(--primary);font-weight:700}.nav span:first-child{font-size:20px;width:26px;text-align:center}
.fab{position:fixed;left:16px;bottom:18px;z-index:20;width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:24px;box-shadow:0 8px 24px rgba(79,70,229,.45);cursor:pointer}
.modal-ov{position:fixed;inset:0;z-index:80;background:rgba(10,12,30,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto;animation:up .25s}
@media(min-width:640px){.modal-ov{align-items:center}.modal{border-radius:24px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1d2135;color:#fff;padding:10px 18px;border-radius:99px;z-index:100;opacity:0;transition:.3s;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:11px;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{aspect-ratio:1/1.05;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-size:14px;border:2px solid transparent;position:relative}
.cal .d.today{border-color:var(--primary)}.cal .d.sel{background:var(--primary);color:#fff}
.cal .d small{font-size:9px;color:var(--muted)}.cal .d.sel small{color:#fff}.cal .d.fri{color:var(--bad)}
.cal .d .dot{position:absolute;top:4px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.cal .d.ok::after{content:'✓';position:absolute;bottom:2px;right:5px;font-size:9px;color:var(--ok)}
.ring{display:block;margin:auto}.ring text{fill:var(--text)}
.tm{text-align:center}.tm .time{font-size:44px;font-weight:700;margin-top:-118px;margin-bottom:70px;font-variant-numeric:tabular-nums}
.emo{display:flex;gap:8px;justify-content:space-between}.emo label{flex:1;margin:0;text-align:center;font-size:28px;cursor:pointer;padding:8px 0;border-radius:14px;background:var(--bg);filter:grayscale(1);opacity:.6}
.emo input{display:none}.emo input:checked+span{filter:none}.emo label:has(input:checked){filter:none;opacity:1;background:var(--primary-soft)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:8px}.emoji-grid button{font-size:24px;width:46px;height:46px;border-radius:14px;border:2px solid transparent;background:var(--bg);cursor:pointer}.emoji-grid button.sel{border-color:var(--primary);background:var(--primary-soft)}
.onb{max-width:460px;margin:0 auto;padding:24px 16px}
.bdg{display:flex;flex-wrap:wrap;gap:8px}.bdg span{padding:6px 12px;border-radius:99px;background:var(--bg);font-size:13px;opacity:.45;filter:grayscale(1)}.bdg span.on{opacity:1;filter:none;background:#fef3c7;color:#92400e}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:14px}
.rep{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}.rep:last-child{border:0}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
</style>
</head>

<script>
'use strict';
/*J-START*/
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let bl=BR.length,gy=jy+621,leapJ=-14,jp=BR[0],jm,jump=0,leap,leapG,march,n,i;
 for(i=1;i<bl;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ++;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;
 leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
 return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
 d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
 const i=div(mod(j,1461),4)*5+308,gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);
 return{gy,gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),j1=g2d(gy,3,r.march);let k=jdn-j1,jm,jd;
 if(k>=0){if(k<=185){return{jy,jm:1+div(k,31),jd:mod(k,31)+1}}else k-=186}
 else{jy-=1;k+=179;if(r.leap===1)k+=1}
 jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const p2=n=>String(n).padStart(2,'0');
const P=s=>{const[a,b,c]=s.split('-').map(Number);return{gy:a,gm:b,gd:c}};
const ISO=(y,m,d)=>`${y}-${p2(m)}-${p2(d)}`;
const addDays=(s,n)=>{const{gy,gm,gd}=P(s);return new Date(Date.UTC(gy,gm-1,gd+n)).toISOString().slice(0,10)};
const dowG=s=>{const{gy,gm,gd}=P(s);return new Date(Date.UTC(gy,gm-1,gd)).getUTCDay()};
const dow=s=>(dowG(s)+1)%7;
const toJ=s=>{const{gy,gm,gd}=P(s);return d2j(g2d(gy,gm,gd))};
const fromJ=(jy,jm,jd)=>{const g=d2g(j2d(jy,jm,jd));return ISO(g.gy,g.gm,g.gd)};
const jLen=(jy,jm)=>jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29);
const fmtJ=s=>{const j=toJ(s);return fa(j.jd)+' '+MONTHS[j.jm-1]+' '+fa(j.jy)};
const fmtJs=s=>{const j=toJ(s);return fa(j.jd)+' '+MONTHS[j.jm-1]};
const fmtJW=s=>DAYS[dow(s)]+' '+fmtJs(s);
const wk=s=>addDays(s,-dow(s));
const diffDays=(a,b)=>{const x=P(a),y=P(b);return Math.round((Date.UTC(y.gy,y.gm-1,y.gd)-Date.UTC(x.gy,x.gm-1,x.gd))/864e5)};
/*J-END*/
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=s=>document.querySelector(s);
const mins=hm=>{const[h,m]=String(hm||'0:0').split(':').map(Number);return(h||0)*60+(m||0)};
const hm=m=>p2(Math.floor(m/60)%24)+':'+p2(m%60);
const fmtDur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;if(!h)return fa(r)+' دقیقه';return r?`${fa(h)} ساعت و ${fa(r)} دقیقه`:`${fa(h)} ساعت`};

/* ---------- زمان (از اینترنت) ---------- */
let delta=0,timeSrc='device';
const tehran=()=>{const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(Date.now()+delta));const o={};f.forEach(p=>o[p.type]=p.value);return{date:`${o.year}-${o.month}-${o.day}`,time:`${o.hour}:${o.minute}`}};
const today=()=>tehran().date;
async function tf(u,fn){const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);try{return await fn(await fetch(u,{signal:c.signal,cache:'no-store'}))}finally{clearTimeout(t)}}
async function syncTime(){
 const before=today();
 try{const ms=await tf('https://worldtimeapi.org/api/timezone/Asia/Tehran',async r=>{const j=await r.json();return new Date(j.utc_datetime||j.datetime).getTime()});if(ms&&!isNaN(ms)){delta=ms-Date.now();timeSrc='internet'}}catch(e){}
 if(timeSrc!=='internet'){try{const ms=await tf(location.href.split('#')[0],async r=>new Date(r.headers.get('Date')).getTime());if(ms&&!isNaN(ms)){delta=ms-Date.now();timeSrc='internet'}}catch(e){}}
 if(today()!==before||timeSrc==='internet')render();
}

/* ---------- داده‌ها ---------- */
const LS={m:{},bad:false,get(k){try{return localStorage.getItem(k)}catch(e){this.bad=true;return k in this.m?this.m[k]:null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){this.bad=true;this.m[k]=v}}};
const SK='sp_data_v1',CK='sp_cfg_v1',GF='study-planner-data.json';
const TYPES={study:'مطالعه',test:'تست‌زنی',review:'مرور',online:'کلاس آنلاین',exam:'آزمون'};
const GRADES=['دهم','یازدهم','دوازدهم','فارغ‌التحصیل'];
const PAL=['#3b82f6','#10b981','#8b5cf6','#f59e0b','#ef4444','#ec4899','#0d9488','#6366f1','#0ea5e9','#65a30d','#a16207','#f97316'];
const DR=[['08:00','09:00'],['09:00','10:00'],['10:00','11:00'],['11:00','12:00'],['15:00','16:00'],['16:00','17:00'],['17:00','18:00'],['18:00','19:00'],['19:00','20:00']];
const defaults=()=>({v:1,updatedAt:0,profile:null,
 subjects:[
  {id:'phy',name:'فیزیک',group:'spec',online:true,color:'#3b82f6'},{id:'che',name:'شیمی',group:'spec',online:true,color:'#10b981'},
  {id:'cal',name:'حسابان',group:'spec',online:true,color:'#8b5cf6'},{id:'geo',name:'هندسه',group:'spec',online:true,color:'#f59e0b'},
  {id:'sta',name:'آمار',group:'spec',online:true,color:'#ef4444'},
  {id:'his',name:'تاریخ',group:'gen',online:true,color:'#a16207'},{id:'per',name:'فارسی',group:'gen',online:true,color:'#ec4899'},
  {id:'ara',name:'عربی',group:'gen',online:true,color:'#0d9488'},{id:'rel',name:'دینی',group:'gen',online:true,color:'#6366f1'},
  {id:'eng',name:'زبان',group:'gen',online:true,color:'#0ea5e9'},{id:'env',name:'محیط زمین',group:'gen',online:true,color:'#65a30d'}],
 plan:{rows:DR.map((t,i)=>({id:'r'+(i+1),start:t[0],end:t[1]})),cells:{}},
 tasks:[],reports:[],closed:{},slotDone:{},goals:[],exams:[],
 settings:{dailyGoal:120,weeklyGoal:20,pomo:{focus:25,brk:5,long:15,every:4}}});
function normalize(o){const d=defaults();o=o&&typeof o==='object'?o:{};for(const k in d)if(o[k]===undefined)o[k]=d[k];const s=o.settings||{};o.settings={...d.settings,...s,pomo:{...d.settings.pomo,...(s.pomo||{})}};if(!o.plan||!Array.isArray(o.plan.rows)||!o.plan.cells)o.plan=d.plan;while(o.plan.rows.length<9){const i=o.plan.rows.length;o.plan.rows.push({id:'p'+uid(),start:DR[i][0],end:DR[i][1]})}return o}
let cfg={};try{cfg=JSON.parse(LS.get(CK)||'{}')||{}}catch(e){}
const saveCfg=()=>{try{LS.set(CK,JSON.stringify(cfg))}catch(e){}};
let S;try{S=normalize(JSON.parse(LS.get(SK)))}catch(e){S=normalize(null)}
function save(){S.updatedAt=Date.now();if(LS.bad&&!save.w){save.w=1;setTimeout(()=>toast('ذخیره‌سازی مرورگر بسته است؛ سایت را در مرورگر عادی یا گیت‌هاب‌پیجز باز کن'),400)}try{LS.set(SK,JSON.stringify(S))}catch(e){toast('حافظه مرورگر پر است!')}queuePush()}

async function gh(path,method='GET',body){const r=await fetch('https://api.github.com'+path,{method,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+cfg.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return r.json()}

 if(!cfg.gistId){const g=await gh('/gists','POST',{description:'Study planner data',public:false,files:{[GF]:{content}}});cfg.gistId=g.id}
 else await gh('/gists/'+cfg.gistId,'PATCH',{files:{[GF]:{content}}});
 cfg.lastSync=Date.now();saveCfg();setSync('ok');return true}catch(e){console.warn(e);setSync('err');return false}}
async function pull(){const g=await gh('/gists/'+cfg.gistId);const f=g.files[GF]||Object.values(g.files)[0];let t=f.content;if(f.truncated)t=await(await fetch(f.raw_url)).text();return normalize(JSON.parse(t))}

 else if(S.updatedAt>r.updatedAt)await push();else setSync('ok')}catch(e){setSync('err')}}

function seeded(seed){let a=seed+0x6D2B79F5;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function quoteOf(iso){const{gy,gm,gd}=P(iso);const di=Math.floor(Date.UTC(gy,gm-1,gd)/864e5),N=QUOTES.length,cyc=Math.floor(di/N),pos=di%N;
 const o=[...Array(N).keys()],r=seeded(cyc+7);for(let i=N-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return QUOTES[o[pos]]}

const repsOn=d=>S.reports.filter(r=>r.date===d);
const minOn=d=>S.reports.reduce((a,r)=>r.date===d?a+r.min:a,0);
const minRange=(a,b)=>S.reports.reduce((s,r)=>r.date>=a&&r.date<=b?s+r.min:s,0);
function breakdown(a,b){const o={};S.reports.forEach(r=>{if(r.date>=a&&r.date<=b)o[r.subject]=(o[r.subject]||0)+r.min});return Object.entries(o).sort((x,y)=>y[1]-x[1])}
function range(p){const t=today();if(p==='day')return[t,t];if(p==='week'){const s=wk(t);return[s,addDays(s,6)]}const j=toJ(t);return[fromJ(j.jy,j.jm,1),fromJ(j.jy,j.jm,jLen(j.jy,j.jm))]}
function dayTotals(){const o={};S.reports.forEach(r=>o[r.date]=(o[r.date]||0)+r.min);return o}
function streak(){const g=Math.max(1,S.settings.dailyGoal);let d=today(),n=0;if(minOn(d)<g)d=addDays(d,-1);while(minOn(d)>=g&&n<3650){n++;d=addDays(d,-1)}return n}
function bestStreak(){const g=Math.max(1,S.settings.dailyGoal),t=dayTotals(),ds=Object.keys(t).filter(d=>t[d]>=g).sort();let best=0,cur=0,prev=null;ds.forEach(d=>{cur=prev&&diffDays(prev,d)===1?cur+1:1;best=Math.max(best,cur);prev=d});return best}
function points(){const g=Math.max(1,S.settings.dailyGoal),t=dayTotals();let p=0;for(const d in t){p+=Math.floor(t[d]/10);if(t[d]>=g)p+=20}p+=5*S.tasks.filter(x=>x.done).length+10*Object.keys(S.closed).length;return p}
function badges(){const tot=S.reports.reduce((a,r)=>a+r.min,0),bs=bestStreak(),sc=S.exams.filter(e=>e.score!==''&&e.score!=null).length,dn=S.tasks.filter(x=>x.done).length;
 return[['🌱 اولین گزارش',S.reports.length>=1],['🔥 ۳ روز پیاپی',bs>=3],['🔥 ۷ روز پیاپی',bs>=7],['🏅 ۳۰ روز پیاپی',bs>=30],['⏳ ۱۰ ساعت مطالعه',tot>=600],['⏳ ۵۰ ساعت مطالعه',tot>=3000],['👑 ۱۰۰ ساعت مطالعه',tot>=6000],['🎯 ۳ آزمون ثبت‌شده',sc>=3],['✅ ۲۵ کار انجام‌شده',dn>=25],['🍅 اولین پومودورو',S.reports.some(r=>r.pomo)]]}
const slotMin=r=>{const d=mins(r.end)-mins(r.start);return d>=0?d:d+1440};
const inSlot=(t,r)=>r.start<r.end?(t>=r.start&&t<r.end):r.start>r.end?(t>=r.start||t<r.end):false;
const dayPlanned=d=>S.plan.rows.reduce((a,r)=>S.plan.cells[r.id+'|'+d]?a+slotMin(r):a,0);
function plannedBySubj(){const o={};for(const k in S.plan.cells){const row=S.plan.rows.find(r=>r.id===k.split('|')[0]);if(!row)continue;const c=S.plan.cells[k];o[c.subject]=(o[c.subject]||0)+slotMin(row)}return o}
const slotsOfDay=d=>S.plan.rows.map(r=>({row:r,cell:S.plan.cells[r.id+'|'+d]})).filter(x=>x.cell).sort((a,b)=>a.row.start.localeCompare(b.row.start));
function upcoming(){const t=today();return S.exams.filter(e=>e.date>=t).sort((a,b)=>a.date.localeCompare(b.date))}
const pct=e=>e.score===''||e.score==null||!e.max?null:Math.round(e.score/e.max*1000)/10;
function cd(date){const n=diffDays(today(),date);return n===0?'امروز!':n===1?'فردا':n>0?fa(n)+' روز مانده':fa(-n)+' روز پیش'}

/* ---------- رندر ---------- */
function applyTheme(){const th=cfg.theme||(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=th}
function render(){
 applyTheme();const app=$('#app');
 if(!S.profile){app.innerHTML=onboard();return}
 const p=S.profile;
 app.innerHTML=`<header class="top"><button class="ic" data-act="drawer" aria-label="منو">☰</button><div class="brand">${logoHtml(p)}<div><b>${esc(p.name)}</b><small>پایه ${esc(p.grade)}</small></div></div><div class="sp"></div><button class="ic" id="syncic" data-act="goto" data-p="settings" title="همگام‌سازی">${SYI[syncState]}</button><button class="ic" data-act="theme" aria-label="تم">🌓</button></header>
 <div class="ov ${ui.drawer?'open':''}" data-act="drawer"></div><aside class="drawer ${ui.drawer?'open':''}"><div class="row" style="padding:6px 8px 14px">${logoHtml(p)}<div><b>داشبورد</b><div class="muted">همه‌ی بخش‌ها از اینجا</div></div></div>${NAV.map(([k,i,l])=>`<button class="nav ${ui.page===k?'on':''}" data-act="goto" data-p="${k}"><span>${i}</span><span>${l}</span></button>`).join('')}${isStandalone()?'':`<button class="nav" data-act="installApp" style="margin-top:8px;border:1px dashed var(--primary)"><span>📲</span><span>${deferredPrompt?'نصب برنامه (بدون نوار آدرس)':'نصب برنامه روی گوشی'}</span></button>`}</aside>
 <main class="wrap">${pages[ui.page]()}</main>${['report','pomo'].includes(ui.page)?'':'<button class="fab" data-act="goto" data-p="report" aria-label="ثبت گزارش">✍️</button>'}`;
}
function route(){let h='';try{h=location.hash.replace('#/','')}catch(e){}ui.page=h||'home';if(!pages[ui.page])ui.page='home';ui.drawer=false;render();window.scrollTo(0,0)}
const go=p=>{ui.page=p;ui.drawer=false;try{history.pushState(null,'','#/'+p)}catch(e){}render();window.scrollTo(0,0)};
window.addEventListener('hashchange',route);window.addEventListener('popstate',route);

/* ---------- کنش‌ها ---------- */
const A={
 installApp(){if(deferredPrompt){const d=deferredPrompt;deferredPrompt=null;d.prompt();if(d.userChoice)d.userChoice.finally(()=>render())}else openModal(`<h3>📲 نصب برنامه</h3><p><b>اندروید (کروم):</b> منوی ⋮ بالای کروم ← «Install app» یا «Add to Home screen».</p><p><b>آیفون (Safari):</b> دکمه Share ← «Add to Home Screen».</p><p class="muted">نصب فقط وقتی کار می‌کند که سایت از آدرس https (مثل گیت‌هاب‌پیجز) باز شده باشد، نه از داخل پیش‌نمایش یا فایل ذخیره‌شده. اگر تازه سایت را باز کرده‌ای، چند ثانیه صبر کن و دوباره امتحان کن.</p><button class="btn ghost" data-act="closeModal">بستن</button>`)},
 drawer(){ui.drawer=!ui.drawer;render()},goto(t){go(t.dataset.p)},
 theme(){const cur=document.documentElement.dataset.theme;cfg.theme=cur==='dark'?'light':'dark';saveCfg();render()},
 ovClose(t,e){if(e.target===t)closeModal()},closeModal,

 taskToggle(t){const x=S.tasks.find(k=>k.id===t.dataset.id);if(x){x.done=!x.done;save();render()}},
 taskDel(t){S.tasks=S.tasks.filter(k=>k.id!==t.dataset.id);save();render()},
 slotToggle(t){const k=t.dataset.k;S.slotDone[k]=!S.slotDone[k];if(!S.slotDone[k])delete S.slotDone[k];save();render()},
 setDur(t){const i=t.closest('form').querySelector('[name=min]');i.value=t.dataset.v},
 repDel(t){S.reports=S.reports.filter(r=>r.id!==t.dataset.id);save();render()},
 repFor(t){ui.repDate=t.dataset.d;go('report')},
 wkNav(t){const v=+t.dataset.v;ui.wk=v===0?0:ui.wk+v;render()},rwNav(t){const v=+t.dataset.v;ui.rw=v===0?0:ui.rw+v;render()},

 calNav(t){const v=+t.dataset.v;if(v===0){const j=toJ(today());ui.calY=j.jy;ui.calM=j.jm;ui.calSel=today()}else{ui.calM+=v;if(ui.calM>12){ui.calM=1;ui.calY++}if(ui.calM<1){ui.calM=12;ui.calY--}}render()},

 rowEdit(t){const id=t.dataset.id,r=S.plan.rows.find(x=>x.id===id);if(!r)return;
  openModal(`<h3>ساعت این ستون</h3><form data-form="row" data-id="${id}"><div class="row"><div class="grow"><label>از</label><input type="time" name="start" value="${r.start}" required></div><div class="grow"><label>تا</label><input type="time" name="end" value="${r.end}" required></div></div><div class="row" style="margin-top:14px"><button class="btn">ذخیره</button><button type="button" class="btn ghost" data-act="closeModal">بستن</button></div></form>`)},
 timesEdit(){openModal(`<h3>ساعت‌های ستون‌ها</h3><form data-form="times">${S.plan.rows.map((r,i)=>`<div class="row" style="margin-top:8px;flex-wrap:nowrap"><b style="width:22px">${fa(i+1)}</b><input type="time" name="s_${r.id}" value="${r.start}" required style="flex:1"><span>تا</span><input type="time" name="e_${r.id}" value="${r.end}" required style="flex:1"></div>`).join('')}<div class="row" style="margin-top:14px"><button class="btn">ذخیره</button><button type="button" class="btn ghost" data-act="closeModal">بستن</button></div></form>`)},
 cellEdit(t){const r=S.plan.rows.find(x=>x.id===t.dataset.r),d=+t.dataset.d,c=S.plan.cells[r.id+'|'+d]||{},sid=c.subject||(S.subjects[0]||{}).id;
  openModal(`<h3>${DAYS[d]} · ${fa(r.start)} – ${fa(r.end)}</h3><form data-form="cell" data-r="${r.id}"><label>درس</label><select name="subject" data-subjsel>${subjOpts(sid)}</select><label>نوع</label><select name="type">${typeOpts(sid,c.type||'study')}</select><label>یادداشت (اختیاری)</label><input name="note" value="${esc(c.note||'')}" maxlength="60">
  <label>اعمال برای روزهای</label><div class="row" style="gap:10px">${DAYS.map((n,i)=>`<label style="display:flex;gap:4px;align-items:center;margin:0;color:var(--text)"><input type="checkbox" name="days" value="${i}" ${i===d?'checked':''}>${n}</label>`).join('')}</div>
  <div class="row" style="margin-top:14px"><button class="btn">ذخیره</button>${c.subject?`<button type="button" class="btn danger" data-act="cellDel" data-k="${r.id}|${d}">حذف</button>`:''}<button type="button" class="btn ghost" data-act="closeModal">بستن</button></div></form>`)},
 cellDel(t){delete S.plan.cells[t.dataset.k];save();closeModal();render()},
 closeDay(){const d=today(),c=S.closed[d]||{rating:4,note:''};
  openModal(`<h3>🌙 پایان گزارش ${fmtJW(d)}</h3><p class="muted" style="margin-top:0">امروز ${fmtDur(minOn(d))} مطالعه کردی.</p><form data-form="closeDay"><label>امروز چطور بود؟</label><div class="emo">${['😞','😕','😐','🙂','🤩'].map((e,i)=>`<label><input type="radio" name="rating" value="${i+1}" ${c.rating===i+1?'checked':''}>${e}</label>`).join('')}</div><label>یادداشت پایان روز</label><textarea name="note" rows="3" maxlength="300" placeholder="چه چیزی خوب پیش رفت؟ فردا چه کار کنم؟">${esc(c.note)}</textarea><div class="row" style="margin-top:14px"><button class="btn">ثبت پایان گزارش</button><button type="button" class="btn ghost" data-act="closeModal">بستن</button></div></form>`)},
 examEdit(t){const id=t.dataset.id,e=S.exams.find(x=>x.id===id)||{kind:'exam',max:20};
  openModal(`<h3>${id?'ویرایش':'آزمون / رویداد جدید'}</h3><form data-form="exam" data-id="${id}"><label>عنوان</label><input name="title" value="${esc(e.title||'')}" required maxlength="60" placeholder="مثلاً آزمون فیزیک / کنکور"><div class="row"><div class="grow"><label>نوع</label><select name="kind"><option value="exam" ${e.kind==='exam'?'selected':''}>آزمون</option><option value="event" ${e.kind==='event'?'selected':''}>رویداد (مثل کنکور)</option></select></div><div class="grow"><label>درس</label><select name="subject">${subjOpts(e.subject||'','عمومی')}</select></div></div><label>تاریخ</label>${jpick('d',e.date)}<div class="row"><div class="grow"><label>نمره (بعد از آزمون)</label><input type="number" step="any" name="score" value="${e.score==null?'':e.score}"></div><div class="grow"><label>از</label><input type="number" step="any" name="max" value="${e.max||20}"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn">ذخیره</button>${id?`<button type="button" class="btn danger" data-act="examDel" data-id="${id}">حذف</button>`:''}<button type="button" class="btn ghost" data-act="closeModal">بستن</button></div></form>`)},
 examDel(t){S.exams=S.exams.filter(x=>x.id!==t.dataset.id);save();closeModal();render()},
 goalEdit(t){const id=t.dataset.id,g=S.goals.find(x=>x.id===id)||{kind:'هفتگی',progress:0,due:addDays(today(),7)};
  openModal(`<h3>${id?'ویرایش هدف':'هدف جدید'}</h3><form data-form="goal" data-id="${id}"><label>هدف</label><input name="title" value="${esc(g.title||'')}" required maxlength="100" placeholder="مثلاً تمام کردن فصل ۳ فیزیک"><label>نوع</label><select name="kind">${['هفتگی','ماهانه','فصلی','سالانه'].map(k=>`<option ${k===g.kind?'selected':''}>${k}</option>`).join('')}</select><label>موعد</label>${jpick('d',g.due)}<label>پیشرفت: <b id="gp">${fa(g.progress)}</b>٪</label><input type="range" name="progress" min="0" max="100" step="5" value="${g.progress}" oninput="document.getElementById('gp').textContent=this.value.replace(/\\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])">
  <div class="row" style="margin-top:14px"><button class="btn">ذخیره</button>${id?`<button type="button" class="btn danger" data-act="goalDel" data-id="${id}">حذف</button>`:''}<button type="button" class="btn ghost" data-act="closeModal">بستن</button></div></form>`)},
 goalDel(t){S.goals=S.goals.filter(x=>x.id!==t.dataset.id);save();closeModal();render()},
 subjDel(t){const id=t.dataset.id;ask('این درس حذف شود؟ گزارش‌های قبلی می‌مانند.',()=>{S.subjects=S.subjects.filter(s=>s.id!==id);save();render()})},
 tmMode(t){if(tm.running)return toast('اول تایمر را متوقف کن');tm.mode=t.dataset.m;tm.left=null;tmSave();render()},

 syncPull(){ask('اطلاعات این دستگاه با نسخه‌ی گیت‌هاب جایگزین شود؟',async()=>{try{setSync('busy');S=await pull();LS.set(SK,JSON.stringify(S));setSync('ok');toast('دریافت شد ✓');render()}catch(e){setSync('err');toast('خطا در دریافت: توکن/شناسه را بررسی کن')}})},

};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t,e)});

const F={
 noop(){},
 onboard(f,fd){const nm=fd.get('name').trim();if(!nm)return toast('نام را وارد کن');S.profile={name:nm,grade:fd.get('grade'),logo:fd.get('logo')};save();toast('خوش آمدی '+S.profile.name+' 🌟');go('home')},

 closeDay(f,fd){S.closed[today()]={rating:+fd.get('rating')||4,note:fd.get('note').trim()};save();closeModal();toast('پایان گزارش امروز ثبت شد 🌙');render()},
 exam(f,fd){const id=f.dataset.id,o={title:fd.get('title').trim(),kind:fd.get('kind'),subject:fd.get('subject'),date:readJ(fd,'d'),score:fd.get('score')===''?'':+fd.get('score'),max:+fd.get('max')||20};if(id)Object.assign(S.exams.find(x=>x.id===id),o);else S.exams.push({id:uid(),...o});save();closeModal();render()},
 goal(f,fd){const id=f.dataset.id,o={title:fd.get('title').trim(),kind:fd.get('kind'),due:readJ(fd,'d'),progress:+fd.get('progress')};if(id)Object.assign(S.goals.find(x=>x.id===id),o);else S.goals.push({id:uid(),...o});save();closeModal();render()},
 addSubj(f,fd){S.subjects.push({id:'s'+uid(),name:fd.get('name').trim(),group:fd.get('group'),online:true,color:PAL[S.subjects.length%PAL.length]});save();render()},
 async sync(f,fd){cfg.token=fd.get('token').trim();cfg.gistId=fd.get('gistId').trim();cfg.auto=!!fd.get('auto');saveCfg();if(!cfg.token){setSync('off');return render()}
  try{if(cfg.gistId){const r=await pull();if(r.updatedAt>S.updatedAt){ask('در گیت‌هاب اطلاعات جدیدتری هست. جایگزین شود؟',()=>{S=r;LS.set(SK,JSON.stringify(S));render()})}else await push()}else await push();toast('متصل شد ✓');setSync('ok')}catch(e){setSync('err');toast('اتصال ناموفق: توکن/شناسه یا اینترنت را بررسی کن')}render()}
};
function runForm(f){const h=F[f.dataset.form];if(h)h(f,new FormData(f))}
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();runForm(f)});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.act||(b.type&&b.type!=='submit'))return;const f=b.closest('form[data-form]');if(!f)return;e.preventDefault();if(f.checkValidity&&!f.checkValidity()){if(f.reportValidity)f.reportValidity();return}runForm(f)},true);
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName!=='INPUT'||e.target.type==='file')return;const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const b=f.querySelector('button:not([type=button])');if(b)b.click()});
document.addEventListener('change',e=>{const t=e.target;
 if(t.matches('[data-subjsel]')&&t.form){const ts=t.form.querySelector('[name=type]');if(ts)ts.innerHTML=typeOpts(t.value,ts.value)}
 if(t.matches('[data-tm]')){tm[t.name]=t.value;if(t.name==='subject'){tm.type=t.form.querySelector('[name=type]').value}tmSave()}
 if(t.matches('[data-logo]')&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=128;c.width=c.height=s;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);const f=t.closest('form');f.querySelector('[name=logo]').value=c.toDataURL('image/jpeg',.8);f.querySelectorAll('.emoji-grid button').forEach(b=>b.classList.remove('sel'));toast('عکس انتخاب شد ✓')};im.src=fr.result};fr.readAsDataURL(t.files[0])}
 if(t.matches('[data-import]')&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=normalize(JSON.parse(fr.result));ask('اطلاعات فعلی با فایل جایگزین شود؟',()=>{S=o;save();toast('بازیابی شد ✓');render()})}catch(e){toast('فایل معتبر نیست')}};fr.readAsText(t.files[0])}
});

/* ---------- شروع ---------- */
let lastDay=today();
setInterval(()=>{const d=today();if(d!==lastDay){lastDay=d;render()}},30000);
route();
if(tm.running&&Date.now()>=tm.endAt)tmComplete();
syncTime().then(()=>{lastDay=today()});
initSync();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
