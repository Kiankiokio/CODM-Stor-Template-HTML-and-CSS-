<style>
:root{--bg:#f5f6fb;--card:#fff;--text:#1d2135;--muted:#6b7285;--primary:#4f46e5;--primary-soft:#eceeff;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--border:#e6e8f2;--r:18px;--shadow:0 1px 2px rgba(20,24,60,.05),0 8px 24px rgba(20,24,60,.06)}
[data-theme=dark]{--bg:#0e111f;--card:#171b2f;--text:#e8eaf6;--muted:#9299b5;--primary:#8b93ff;--primary-soft:#232849;--border:#262b47;--shadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Vazirmatn',Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.8;font-size:15px;padding-bottom:90px}

button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:14px}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.top .brand{display:flex;align-items:center;gap:10px;min-width:0}
.top .brand b{display:block;line-height:1.3}.top .brand small{color:var(--muted);font-size:12px}
.logo{width:38px;height:38px;border-radius:12px;background:var(--primary-soft);display:grid;place-items:center;font-size:22px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.sp{flex:1}
.ic{width:40px;height:40px;border:1px solid var(--border);background:var(--card);border-radius:12px;cursor:pointer;font-size:18px;display:grid;place-items:center}

.hero{background:linear-gradient(135deg,var(--h1,#4f46e5),var(--h2,#a855f7));color:#fff;border:0}
.hero small{opacity:.85}.hero .q{font-size:17px;font-weight:500;margin-top:10px;line-height:2}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.muted{color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary)}
input[type=checkbox],input[type=radio]{width:auto}

.mini{font-style:normal;font-size:11px;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--c,#888) 16%,transparent);color:var(--c,#888);margin-right:6px}
.badge{font-size:11px;padding:1px 8px;border-radius:99px;background:var(--primary-soft);color:var(--primary)}
.task{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px dashed var(--border)}

.task input{width:20px;height:20px;accent-color:var(--primary)}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:14px}
.add{display:flex;gap:6px;margin-top:10px}.add input{flex:1}.add select{width:120px}
.slot{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:color-mix(in srgb,var(--c) 10%,var(--card));border:1px solid color-mix(in srgb,var(--c) 30%,transparent);border-right:5px solid var(--c);cursor:pointer}
.slot.now{box-shadow:0 0 0 2px var(--c)}.slot.done{opacity:.55}
.slot .time{font-size:12px;color:var(--muted);min-width:78px}.slot small{display:block;color:var(--muted)}
.tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;color:#fff;background:transparent;font-size:14px}
.slot.done .tick{background:var(--c)}
.scroll{overflow-x:auto;margin:0 -4px;padding:0 4px}
.cell .tp{font-weight:400;font-size:10px;opacity:.9}.cell .nt{font-weight:400;font-size:10px;margin-top:2px;padding-top:2px;border-top:1px solid rgba(255,255,255,.35);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}

.cell{border-radius:9px;padding:6px 2px;font-size:12px;font-weight:600;color:#fff;background:var(--c);line-height:1.5}
.plus{color:var(--muted);font-size:18px}
.stat{padding:14px;border-radius:16px;background:var(--primary-soft);text-align:center}

.drawer{position:fixed;top:0;bottom:0;right:0;width:290px;max-width:86vw;background:var(--card);transform:translateX(105%);transition:.28s;z-index:60;padding:16px 12px;overflow:auto;border-left:1px solid var(--border)}
.drawer.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.2)}
.ov{position:fixed;inset:0;background:rgba(10,12,30,.5);opacity:0;pointer-events:none;transition:.25s;z-index:50}.ov.open{opacity:1;pointer-events:auto}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;background:none;border-radius:14px;cursor:pointer;text-align:right;font-size:15px}
.nav.on{background:var(--primary-soft);color:var(--primary);font-weight:700}.nav span:first-child{font-size:20px;width:26px;text-align:center}
.fab{position:fixed;left:16px;bottom:18px;z-index:20;width:56px;height:56px;border-radius:50%;border:0;background:var(--primary);color:#fff;font-size:24px;box-shadow:0 8px 24px rgba(79,70,229,.45);cursor:pointer}
.modal-ov{position:fixed;inset:0;z-index:80;background:rgba(10,12,30,.55);display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px;max-height:92vh;overflow:auto;animation:up .25s}
@media(min-width:640px){.modal-ov{align-items:center}.modal{border-radius:24px}}

#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1d2135;color:#fff;padding:10px 18px;border-radius:99px;z-index:100;opacity:0;transition:.3s;pointer-events:none;font-size:14px;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.cal .d{aspect-ratio:1/1.05;border-radius:12px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-size:14px;border:2px solid transparent;position:relative}
.cal .d.today{border-color:var(--primary)}.cal .d.sel{background:var(--primary);color:#fff}
.cal .d small{font-size:9px;color:var(--muted)}.cal .d.sel small{color:#fff}.cal .d.fri{color:var(--bad)}
.cal .d .dot{position:absolute;top:4px;left:5px;width:6px;height:6px;border-radius:50%;background:var(--bad)}
.cal .d.ok::after{content:'✓';position:absolute;bottom:2px;right:5px;font-size:9px;color:var(--ok)}
.ring{display:block;margin:auto}.ring text{fill:var(--text)}
.tm{text-align:center}.tm .time{font-size:44px;font-weight:700;margin-top:-118px;margin-bottom:70px;font-variant-numeric:tabular-nums}
.emo{display:flex;gap:8px;justify-content:space-between}.emo label{flex:1;margin:0;text-align:center;font-size:28px;cursor:pointer;padding:8px 0;border-radius:14px;background:var(--bg);filter:grayscale(1);opacity:.6}
.emo input{display:none}.emo input:checked+span{filter:none}.emo label:has(input:checked){filter:none;opacity:1;background:var(--primary-soft)}
.emoji-grid{display:flex;flex-wrap:wrap;gap:8px}.emoji-grid button{font-size:24px;width:46px;height:46px;border-radius:14px;border:2px solid transparent;background:var(--bg);cursor:pointer}.emoji-grid button.sel{border-color:var(--primary);background:var(--primary-soft)}
.onb{max-width:460px;margin:0 auto;padding:24px 16px}
.bdg{display:flex;flex-wrap:wrap;gap:8px}.bdg span{padding:6px 12px;border-radius:99px;background:var(--bg);font-size:13px;opacity:.45;filter:grayscale(1)}.bdg span.on{opacity:1;filter:none;background:#fef3c7;color:#92400e}
.empty{text-align:center;color:var(--muted);padding:18px 6px;font-size:14px}
.rep{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);font-size:14px}.rep:last-child{border:0}
hr{border:0;border-top:1px solid var(--border);margin:14px 0}
.pill{display:inline-flex;gap:6px;align-items:center;font-size:12px;padding:2px 10px;border-radius:99px;background:rgba(255,255,255,.18)}
.wid:empty{display:none}.wid{margin-bottom:12px}
.wid-in{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:8px 12px;font-size:13px;cursor:pointer}
.wbar{width:64px;height:7px;border-radius:7px;background:var(--bg);overflow:hidden;flex:none}.wbar i{display:block;height:100%;background:var(--primary);border-radius:7px}
.offb{background:#f59e0b;color:#1d2135;text-align:center;font-size:13px;padding:4px 8px}
.sw{width:40px!important;height:40px!important;border-radius:50%!important}
.ck{display:flex;gap:8px;align-items:center;color:var(--text);margin:8px 0}
.printonly{display:none}
.focus{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 30%,#1e2147,#0b0d1c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
.focus .ftime{font-size:min(26vw,120px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.focus .fsub{font-size:22px;opacity:.9}.focus .fmode{opacity:.7}
.focus .fx{position:absolute;top:16px;left:16px;font-size:20px;background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:50%;width:44px;height:44px;cursor:pointer}
.focus .btn{background:rgba(255,255,255,.16)}.focus .btn.on{background:#fff;color:#1e2147}
.bars i.dim{opacity:.4}
@media print{.top,.drawer,.ov,.fab,#wid,.btn,.tabs,.x,#toast,.offb,.noprint,#focus{display:none!important}.printonly{display:block!important;margin-bottom:8px;font-weight:700}
 html[data-theme]{--bg:#fff;--card:#fff;--text:#000;--muted:#555;--border:#ddd}body{background:#fff;padding:0}.card{box-shadow:none;break-inside:avoid}.wrap{max-width:none;padding:0}}
</style>

<script>
'use strict';
/*J-START*/
const div=(a,b)=>~~(a/b),mod=(a,b)=>a-~~(a/b)*b;
const BR=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy){let bl=BR.length,gy=jy+621,leapJ=-14,jp=BR[0],jm,jump=0,leap,leapG,march,n,i;
 for(i=1;i<bl;i++){jm=BR[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm}
 n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
 if(mod(jump,33)===4&&jump-n===4)leapJ++;
 leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
 if(jump-n<6)n=n-jump+div(jump+4,33)*33;
 leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
 return{leap,gy,march}}
function g2d(gy,gm,gd){let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;
 d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d}
function d2g(jdn){let j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;
 const i=div(mod(j,1461),4)*5+308,gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);
 return{gy,gm,gd}}
function j2d(jy,jm,jd){const r=jalCal(jy);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy),j1=g2d(gy,3,r.march);let k=jdn-j1,jm,jd;
 if(k>=0){if(k<=185){return{jy,jm:1+div(k,31),jd:mod(k,31)+1}}else k-=186}
 else{jy-=1;k+=179;if(r.leap===1)k+=1}
 jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd}}
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const fa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const p2=n=>String(n).padStart(2,'0');
const P=s=>{const[a,b,c]=s.split('-').map(Number);return{gy:a,gm:b,gd:c}};
const ISO=(y,m,d)=>`${y}-${p2(m)}-${p2(d)}`;
const addDays=(s,n)=>{const{gy,gm,gd}=P(s);return new Date(Date.UTC(gy,gm-1,gd+n)).toISOString().slice(0,10)};
const dowG=s=>{const{gy,gm,gd}=P(s);return new Date(Date.UTC(gy,gm-1,gd)).getUTCDay()};
const dow=s=>(dowG(s)+1)%7;
const toJ=s=>{const{gy,gm,gd}=P(s);return d2j(g2d(gy,gm,gd))};
const fromJ=(jy,jm,jd)=>{const g=d2g(j2d(jy,jm,jd));return ISO(g.gy,g.gm,g.gd)};
const jLen=(jy,jm)=>jm<=6?31:jm<=11?30:(jalCal(jy).leap===0?30:29);
const fmtJ=s=>{const j=toJ(s);return fa(j.jd)+' '+MONTHS[j.jm-1]+' '+fa(j.jy)};
const fmtJs=s=>{const j=toJ(s);return fa(j.jd)+' '+MONTHS[j.jm-1]};
const fmtJW=s=>DAYS[dow(s)]+' '+fmtJs(s);
const wk=s=>addDays(s,-dow(s));
const diffDays=(a,b)=>{const x=P(a),y=P(b);return Math.round((Date.UTC(y.gy,y.gm-1,y.gd)-Date.UTC(x.gy,x.gm-1,x.gd))/864e5)};
/*J-END*/
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const $=s=>document.querySelector(s);
const mins=hm=>{const[h,m]=String(hm||'0:0').split(':').map(Number);return(h||0)*60+(m||0)};
const hm=m=>p2(Math.floor(m/60)%24)+':'+p2(m%60);
const fmtDur=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;if(!h)return fa(r)+' دقیقه';return r?`${fa(h)} ساعت و ${fa(r)} دقیقه`:`${fa(h)} ساعت`};

/* ---------- زمان (از اینترنت) ---------- */
let delta=0,timeSrc='device';
const tehran=()=>{const f=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tehran',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(Date.now()+delta));const o={};f.forEach(p=>o[p.type]=p.value);return{date:`${o.year}-${o.month}-${o.day}`,time:`${o.hour}:${o.minute}`}};
const today=()=>tehran().date;
async function tf(u,fn){const c=new AbortController(),t=setTimeout(()=>c.abort(),5000);try{return await fn(await fetch(u,{signal:c.signal,cache:'no-store'}))}finally{clearTimeout(t)}}
async function syncTime(){
 const before=today();
 try{const ms=await tf('https://worldtimeapi.org/api/timezone/Asia/Tehran',async r=>{const j=await r.json();return new Date(j.utc_datetime||j.datetime).getTime()});if(ms&&!isNaN(ms)){delta=ms-Date.now();timeSrc='internet'}}catch(e){}
 if(timeSrc!=='internet'){try{const ms=await tf(location.href.split('#')[0],async r=>new Date(r.headers.get('Date')).getTime());if(ms&&!isNaN(ms)){delta=ms-Date.now();timeSrc='internet'}}catch(e){}}
 if(today()!==before||timeSrc==='internet')render();
}

const LS={m:{},bad:false,get(k){try{return localStorage.getItem(k)}catch(e){this.bad=true;return k in this.m?this.m[k]:null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){this.bad=true;this.m[k]=v}}};

const DR=[['08:00','09:00'],['09:00','10:00'],['10:00','11:00'],['11:00','12:00'],['15:00','16:00'],['16:00','17:00'],['17:00','18:00'],['18:00','19:00'],['19:00','20:00']];
const defaults=()=>({v:1,updatedAt:0,profile:null,

function quoteOf(iso){const{gy,gm,gd}=P(iso);const di=Math.floor(Date.UTC(gy,gm-1,gd)/864e5),N=QUOTES.length,cyc=Math.floor(di/N),pos=di%N;
 const o=[...Array(N).keys()],r=seeded(cyc+7);for(let i=N-1;i>0;i--){const j=Math.floor(r()*(i+1));[o[i],o[j]]=[o[j],o[i]]}return QUOTES[o[pos]]}

/* ---------- چیدمان هوشمند ---------- */
function strength(sid){const parts=[];
 const ex=S.exams.filter(e=>e.subject===sid&&pct(e)!=null).sort((a,b)=>a.date.localeCompare(b.date)).slice(-3);if(ex.length)parts.push(ex.reduce((a,e)=>a+pct(e),0)/ex.length);
 const ts=S.tests.filter(x=>x.subject===sid).sort((a,b)=>a.date.localeCompare(b.date)).slice(-5);if(ts.length){const n=ts.reduce((a,x)=>a+x.total,0),c=ts.reduce((a,x)=>a+x.correct,0),w=ts.reduce((a,x)=>a+x.wrong,0);parts.push(Math.max(0,Math.min(100,kp(c,w,n))))}
 const tp=S.topics[sid]||[];if(tp.length)parts.push(tp.reduce((a,x)=>a+x.mastery,0)/tp.length);
 return parts.length?parts.reduce((a,b)=>a+b,0)/parts.length:null}
function smartAlloc(){const goal=Math.max(60,S.settings.weeklyGoal*60),t=today();
 const rows=S.subjects.map(sb=>{const st=strength(sb.id),exam=S.exams.some(e=>e.subject===sb.id&&e.date>=t&&diffDays(t,e.date)<=14);let w=(st==null?50:100-st)+25;if(exam)w*=1.4;return{id:sb.id,st,exam,w}});
 const sum=rows.reduce((a,r)=>a+r.w,0)||1;rows.forEach(r=>r.min=goal*r.w/sum);return rows.sort((a,b)=>b.min-a.min)}
function smartPlan(ws){const cs=wcells(ws),alloc=smartAlloc(),rows=S.plan.rows;if(!alloc.length||!rows.length)return[];
 const avg=rows.reduce((a,r)=>a+slotMin(r),0)/rows.length||60,goal=Math.max(60,S.settings.weeklyGoal*60),empty=[];
 for(let d=0;d<7;d++)rows.forEach(r=>{if(!cs[r.id+'|'+d])empty.push({d,r})});
 const target=Math.min(empty.length,Math.max(1,Math.round(goal/avg))),q=[0,1,2,3,4,5,6].map(d=>Math.floor(target/7)+(d<target%7?1:0));
 let chosen=[];for(let d=0;d<7;d++)chosen=chosen.concat(empty.filter(e=>e.d===d).slice(0,q[d]));
 if(chosen.length<target){const left=empty.filter(e=>!chosen.includes(e));chosen=chosen.concat(left.slice(0,target-chosen.length))}
 chosen.sort((a,b)=>a.d-b.d||a.r.start.localeCompare(b.r.start));
 const n=chosen.length,tot=alloc.reduce((a,r)=>a+r.min,0)||1,cnt=alloc.map(r=>({id:r.id,x:r.min/tot*n}));
 cnt.forEach(c=>{c.n=Math.floor(c.x);c.f=c.x-c.n});let rest=n-cnt.reduce((a,c)=>a+c.n,0);cnt.slice().sort((a,b)=>b.f-a.f).forEach(c=>{if(rest>0){c.n++;rest--}});
 const seq=[];let more=true;while(more){more=false;cnt.slice().sort((a,b)=>b.n-a.n).forEach(c=>{if(c.n>0){seq.push(c.id);c.n--;more=true}})}
 return chosen.map((e,i)=>({d:e.d,rid:e.r.id,subject:seq[i]}))}

 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.resume)AC.resume();const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
  for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+0.02*w)/1.02;d[i]=last*3.5}else d[i]=w*0.5}
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;const g=AC.createGain();g.gain.value=kind==='rain'?.35:.22;
  if(kind==='rain'){const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2800;f.Q.value=.5;src.connect(f);f.connect(g)}else src.connect(g);
  g.connect(AC.destination);src.start();noiseNode={src,g}}catch(e){toast('پخش صدا در این مرورگر ممکن نیست')}}
function renderFocus(){const e=$('#focus');if(!e)return;if(!ui.focus||(cfg.lock&&!unlocked)){e.innerHTML='';return}
 const L=tmLeft();
 e.innerHTML=`<div class="focus"><button class="fx" data-act="focusExit" aria-label="خروج">✕</button><div class="fmode">${tm.mode==='focus'?'🍅 زمان تمرکز':tm.mode==='short'?'☕ استراحت کوتاه':'🌿 استراحت بلند'}</div><div class="fsub">${esc(tm.subject?sname(tm.subject):'')}</div><div class="ftime" id="ftime">${fa(p2(Math.floor(L/60)))}:${fa(p2(L%60))}</div><div class="row" style="justify-content:center"><button class="btn" data-act="tmToggle">${tm.running?'⏸ توقف':'▶ شروع'}</button></div><div class="row" style="justify-content:center;margin-top:10px">${[['off','🔇 بی‌صدا'],['white','🌫 نویز سفید'],['rain','🌧 باران'],['brown','🌊 نویز قهوه‌ای']].map(([k,l])=>`<button class="btn sm ${noiseKind===k?'on':''}" data-act="noise" data-n="${k}">${l}</button>`).join('')}</div></div>`}

/* ---------- یادآور ---------- */
const remindCfg=()=>Object.assign({on:false,before:10,night:true,nightAt:'21:30'},cfg.remind||{});
function notify(title,body,tag){try{if(typeof Notification==='undefined'||Notification.permission!=='granted')return false;const o={body,tag,icon:'icon-192.png',dir:'rtl',lang:'fa'};
 if(navigator.serviceWorker&&navigator.serviceWorker.ready&&navigator.serviceWorker.controller)navigator.serviceWorker.ready.then(r=>r.showNotification(title,o)).catch(()=>{try{new Notification(title,o)}catch(e){}});else new Notification(title,o);return true}catch(e){return false}}
function remindTick(){const R=remindCfg();if(!R.on||!S.profile)return;const{date,time}=tehran(),nm=mins(time);let ch=false;cfg.fired=cfg.fired||{};
 for(const k of Object.keys(cfg.fired))if(!k.startsWith(date)){delete cfg.fired[k];ch=true}
 const fire=(key,title,body)=>{if(cfg.fired[key])return;if(notify(title,body,key)){cfg.fired[key]=1;ch=true}};
 slotsOfDate(date).forEach(({row,cell})=>{if(S.slotDone[date+'|'+row.id])return;const diff=mins(row.start)-nm;if(diff>=0&&diff<=R.before)fire(date+'|s|'+row.id,'⏰ '+sname(cell.subject),(diff===0?'همین حالا شروع می‌شود':fa(diff)+' دقیقه‌ی دیگر شروع می‌شود')+(cell.note?' — '+cell.note:''))});
 if(R.night&&nm>=mins(R.nightAt)&&!S.closed[date])fire(date+'|n','🌙 گزارش امروز','گزارش امروز را ثبت کن و روز را ببند.');
 const dr=dueReviews().length;if(dr&&nm>=480)fire(date+'|r','🔁 مرور امروز',fa(dr)+' مبحث برای مرور منتظر توست.');
 if(ch)saveCfg()}
function remindCard(){const R=remindCfg(),sup=typeof Notification!=='undefined',perm=sup?Notification.permission:'unsupported';
 return`<div class="card"><h2>🔔 یادآور</h2><form data-form="remind">${chk('on',R.on,'فعال‌سازی یادآور و اعلان')}<div class="row"><div class="grow"><label>چند دقیقه قبل از هر بخش</label><input type="number" name="before" min="1" max="120" value="${R.before}"></div><div class="grow"><label>ساعت یادآور گزارش شب</label><input type="time" name="nightAt" value="${R.nightAt}"></div></div>${chk('night',R.night,'یادآور ثبت گزارش و پایان روز')}<div class="row" style="margin-top:8px"><button class="btn">ذخیره</button><button type="button" class="btn ghost" data-act="remindTest">اعلان آزمایشی</button></div></form><p class="muted">اجازه‌ی اعلان: ${perm==='granted'?'✅ داده شده':perm==='denied'?'⛔ مسدود است (از تنظیمات مرورگر باز کن)':perm==='unsupported'?'این مرورگر اعلان را پشتیبانی نمی‌کند':'هنوز پرسیده نشده'}<br>⚠️ برنامه سرور ندارد؛ پس اعلان‌ها فقط وقتی کار می‌کنند که برنامه باز باشد یا در پس‌زمینه‌ی گوشی زنده بماند. اگر کاملاً بسته باشد، برای اعلان مطمئن از آلارم گوشی هم استفاده کن.</p></div>`}

window.addEventListener('online',()=>{online=true;const e=$('#offb');if(e)e.style.display='none';syncTime();if(cfg.token&&cfg.gistId&&cfg.auto!==false)push()});
window.addEventListener('offline',()=>{online=false;const e=$('#offb');if(e)e.style.display='block'});
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(cfg.lock&&unlocked&&hiddenAt&&Date.now()-hiddenAt>300000){unlocked=false;render()}});
/* ---------- شروع ---------- */
let lastDay=today();
setInterval(()=>{const d=today();if(d!==lastDay){lastDay=d;render()}const w=$('#wid');if(w&&unlocked)w.innerHTML=widgetFor()},30000);
route();
if(tm.running&&Date.now()>=tm.endAt)tmComplete();
syncTime().then(()=>{lastDay=today()});
initSync();
setInterval(remindTick,20000);remindTick();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
